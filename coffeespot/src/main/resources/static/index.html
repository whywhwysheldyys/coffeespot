<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoffeeSpot</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
    <div>
        <h1>CoffeeSpot</h1>
        <p class="subtitle">Напитки, ингредиенты, рецепты и продажа</p>
    </div>
    <button id="refreshBtn" type="button">Обновить данные</button>
</header>

<main class="grid">
    <section class="card">
        <h2>Напитки</h2>
        <form id="drinkForm" class="form-grid">
            <input name="name" type="text" placeholder="Название (Латте)" required />
            <input name="category" type="text" placeholder="Категория (Кофе)" required />
            <input name="volumeMl" type="number" min="1" placeholder="Объём, мл (250)" required />
            <input name="price" type="number" step="0.01" min="0" placeholder="Цена (5.50)" required />
            <button class="primary" type="submit">Добавить напиток</button>
        </form>
        <div id="drinksList" class="list">Загрузка...</div>
    </section>

    <section class="card">
        <h2>Ингредиенты</h2>
        <form id="ingredientForm" class="form-grid">
            <input name="name" type="text" placeholder="Название (Молоко)" required />
            <input name="unit" type="text" placeholder="Ед. изм. (мл / г)" required />
            <input name="stockQuantity" type="number" step="0.01" min="0" placeholder="Остаток (1000)" required />
            <button class="primary" type="submit">Добавить ингредиент</button>
        </form>
        <div id="ingredientsList" class="list">Загрузка...</div>
    </section>

    <section class="card">
        <h2>Рецепт и приготовление</h2>
        <div id="recipePanel" class="list">Выберите напиток</div>
        <div id="statusBox" class="status" hidden></div>
    </section>
</main>

<script src="/app.js" defer></script>
</body>
</html>
